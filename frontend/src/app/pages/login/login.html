<div class="auth-container">

  <!-- WATERMARK -->
  <div class="bg-watermark">
    <h1>ALL YOU NEED</h1>
    <p>Learn. Build. Grow. Repeat.</p>
  </div>

  <!-- CARD -->
  <div class="auth-card">

    <div class="logo-box">AYN</div>

    <h2>AYNversity</h2>
    <p>Sign in to continue</p>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

      <!-- EMAIL -->
      <input type="email" formControlName="email" placeholder="Email" />

      <div class="error"
        *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
        Enter a valid email
      </div>

      <!-- PASSWORD -->
      <input type="password" formControlName="password" placeholder="Password" />

      <div class="error"
        *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
        Password must be at least 6 characters
      </div>

      <!-- BUTTON -->
      <button type="submit" [disabled]="loginForm.invalid || loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>

    </form>

    <!-- ERROR / SWITCH -->
    <p class="switch">
      Don’t have an account?
      <a routerLink="/signup">Create Account</a>
    </p>

  </div>

</div>
