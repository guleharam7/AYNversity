<h2>Available Courses</h2>

<table>
  <thead>
    <tr>
      <th>Title</th>
      <th>Instructor</th>
      <th>Price</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let course of courses">
      <td>{{ course.title }}</td>
      <td>{{ course.instructor }}</td>
      <td>{{ course.price }}</td>

      <td>
        <button [routerLink]="['/edit-course', course.id]">Edit</button>
        <button (click)="deleteCourse(course.id)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
